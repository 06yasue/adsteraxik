  <!-- SCRIPT PENARIK DATA JSON -->
  <script>
  (async function() {
    const f = document.querySelector(".xh-frame");
    const t = document.querySelector(".xh-time");
    const pBar = document.querySelector(".xh-progress-red");
    if (!f) return;
    function timeToSeconds(str) {
      const p = str.split(':');
      return p.length === 2 ? parseInt(p[0]) * 60 + parseInt(p[1]) : 0;
    }
    function secondsToTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }
    try {
      const res = await fetch('https://rawcdn.githack.com/hyein89/get-img/97b83b9df794bf065487ad4f4b2ffb795a2fdca2/newxxtv.json');
      if (!res.ok) throw new Error();
      const data = await res.json();
      if (!Array.isArray(data) || data.length === 0) throw new Error();
      const id = new URLSearchParams(location.search).get("id");
      let item = id ? data.find(x => String(x.id) === String(id)) : null;
      if (!item) item = data[Math.floor(Math.random() * data.length)];
      if (item && item.var_2) {
        f.src = item.var_2;
        f.classList.add("loaded");
        setTimeout(() => f.classList.add("clear-blur"), 800);
        if (t && item.time) {
          const totalSec = timeToSeconds(item.time);
          let rSec = Math.floor(Math.random() * (totalSec * 0.3)) + 5; 
          if (rSec > totalSec) rSec = totalSec;
          t.textContent = secondsToTime(rSec) + " / " + item.time;
          if (pBar) pBar.style.width = ((rSec / totalSec) * 100) + "%";
        }
        f.onerror = () => { f.remove(); if (t) t.remove(); };
      } else { throw new Error(); }
    } catch (e) {
      f.remove(); if (t) t.remove();
    }
  })();
  </script>
